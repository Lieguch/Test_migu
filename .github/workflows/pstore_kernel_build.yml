name: Pstore RK3288 3.10 kernel build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pstore_kernel_build.yml'
      - 'kernel_patches/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Environment Recon
        run: |
          set -euo pipefail
          echo "== nproc =="; nproc
          echo "== mem =="; free -h
          echo "== disk =="; df -h / /tmp /home | head -8
          echo "== gcc =="; gcc --version | head -1 || true
          echo "== arm cross gcc =="; arm-linux-gnueabi-gcc --version 2>/dev/null | head -1 || true

      - name: Install ARM cross toolchain and kernel build deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq --no-install-recommends \
            git make gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi flex bison libelf-dev \
            libssl-dev libncurses5-dev xxd curl ca-certificates
          echo "== versions =="
          arm-linux-gnueabi-gcc --version | head -1
          arm-linux-gnueabi-ld --version | head -1
          arm-linux-gnueabi-ar --version | head -1

      - name: Clone RK3288 Linux 3.10 source
        run: |
          set -euo pipefail
          if [ -d rk3288_linux3.10/.git ]; then
            echo "Kernel source already present"
          else
            git clone --depth 1 https://github.com/uyhoangtran/rk3288_linux3.10.git rk3288_linux3.10
          fi
          cd rk3288_linux3.10
          echo "== source version =="
          cat Makefile | head -5
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)=' Makefile || true

      - name: Add GCC compatibility shim for Linux 3.10
        run: |
          set -euo pipefail
          cd rk3288_linux3.10
          # Linux 3.10 predates compiler-gcc10/11/12 headers. Modern Ubuntu ARM GCC
          # ships a generic compiler-gcc.h that switches on __GNUC__. For 3.10 the
          # safest shim maps any modern gcc to compiler-gcc4.h semantics.
          # Detect the real major without relying on -dumpversion line parsing.
          gcc_major=$(arm-linux-gnueabi-gcc -dumpversion | cut -d. -f1)
          echo "Cross GCC major detected: $gcc_major"
          # Always create the shim header regardless (idempotent, safe) so that
          # -include linux/compiler-gcc.h resolves to a known-good base.
          if [ ! -f include/linux/compiler-gcc${gcc_major}.h ]; then
            printf '#include "compiler-gcc4.h"\n' > "include/linux/compiler-gcc${gcc_major}.h"
            echo "Created shim include/linux/compiler-gcc${gcc_major}.h -> compiler-gcc4.h"
          else
            echo "Shim include/linux/compiler-gcc${gcc_major}.h already exists"
          fi

      - name: Generate pstore-enabled defconfig
        run: |
          set -euo pipefail
          cd rk3288_linux3.10
          # Firefly RK3288 defconfig is the closest available base for RK3288.
          cp arch/arm/configs/firefly-rk3288_defconfig .config
          # 3.10 names ramoops as PSTORE_RAM, not RAMOOPS.
          # Force =y (built-in) so pstore symbols land directly in zImage; =m would
          # produce a loadable module and leave zImage with no pstore strings.
          cat >> .config <<'EOF'
          CONFIG_PSTORE=y
          CONFIG_PSTORE_CONSOLE=y
          CONFIG_PSTORE_RAM=y
          CONFIG_REED_SOLOMON=m
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_TMPFS=y
          CONFIG_PROC_FS=y
          EOF
          # Resolve any missing symbols without dropping the explicitly added pstore options.
          # olddefconfig may re-resolve dependencies, but zImage build only requires a
          # consistent .config; we intentionally avoid `make olddefconfig` removing items.
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- HOST_EXTRACFLAGS="-fcommon" olddefconfig 2>&1 | tee olddefconfig.log || true
          # Re-assert pstore flags after kconfig resolution.
          cat >> .config <<'EOF'
          CONFIG_PSTORE=y
          CONFIG_PSTORE_CONSOLE=y
          CONFIG_PSTORE_RAM=y
          EOF
          echo "== pstore config lines =="
          grep -n 'PSTORE' .config || true

      - name: Build zImage with pstore
        run: |
          set -euo pipefail
          cd rk3288_linux3.10
          # GCC >=10 defaults to -fno-common, which breaks Linux 3.10 host tools:
          #   ld: scripts/dtc/dtc-parser.tab.o: multiple definition of `yylloc'
          # HOST_EXTRACFLAGS is appended to _hostc_flags in scripts/Makefile.host and
          # is empty by default, so setting it cannot clobber -Wall/-O2 or -I paths.
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- HOST_EXTRACFLAGS="-fcommon" zImage -j"$(nproc)" 2>&1 | tee zImage_build.log
          test -f arch/arm/boot/zImage
          echo "== zImage info =="
          ls -lh arch/arm/boot/zImage
          file arch/arm/boot/zImage 2>/dev/null || true
          sha256sum arch/arm/boot/zImage

      - name: Verify pstore symbols in zImage
        run: |
          set -uo pipefail
          cd rk3288_linux3.10
          echo "== pstore config resolution (from .config) =="
          grep -E '^CONFIG_PSTORE|^CONFIG_PSTORE_CONSOLE|^CONFIG_PSTORE_RAM' .config || echo "WARN: pstore lines absent in .config"
          echo
          echo "== strings matching pstore/last_kmsg/ramoops in zImage =="
          found=$(strings arch/arm/boot/zImage | grep -Ei 'pstore|last_kmsg|ramoops' | sort -u || true)
          echo "${found:-<none found in zImage text section>}"
          echo
          echo "== pstore .o objects built by kbuild =="
          ls -lh fs/pstore/*.o 2>/dev/null || echo "no fs/pstore/*.o (modular build)"
          ls -lh lib/raid/*.o 2>/dev/null | head -5 || true
          echo
          echo "== report =="
          {
            echo "PSTORE ZIMAGE VERIFICATION"
            echo "========================="
            gcc_full=$(arm-linux-gnueabi-gcc --version 2>/dev/null | head -1 || echo unknown)
            echo "Cross GCC: $gcc_full"
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            ls -lh arch/arm/boot/zImage
            sha256sum arch/arm/boot/zImage
            echo
            echo "CONFIG grep:"
            grep -E '^CONFIG_PSTORE' .config || true
            echo
            echo "Strings hit in zImage:"
            echo "$found"
          } > pstore_zimage_report.txt
          cat pstore_zimage_report.txt
          # 关键门禁：zImage 必须含 pstore 相关符号，否则后续注镜像白做。
          if [ -z "$found" ]; then
            echo "GATE FAIL: no pstore symbols in zImage (likely modular build)"
            exit 1
          fi
          echo "GATE PASS: pstore symbols present in zImage"

      - name: Upload pstore zImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zImage-pstore-rk3288
          path: |
            rk3288_linux3.10/arch/arm/boot/zImage
            rk3288_linux3.10/pstore_zimage_report.txt
            rk3288_linux3.10/zImage_build.log
            rk3288_linux3.10/olddefconfig.log
