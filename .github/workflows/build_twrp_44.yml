name: Stage-2 TWRP 4.4 build (urbetter D817 / RK3288W)

# ---------------------------------------------------------------------------
# ★ 2026-10-12 根因修复 v1（卡 LOGO 事故）★
#
# 前身 build_twrp_stage2.yml 基于 omni twrp-9.0 → TWRP 3.3.1，其 sepolicy
# 版本=30，超出本机内核上限（实测 /sys/fs/selinux/policyvers=28，
# Linux 3.10 上游 POLICYDB_VERSION_MAX=28）→ 内核 security_load_policy()
# 返回 -EINVAL → init 早期卡死 → 卡 LOGO 砖机（2026-10-12 事故，§9.20）。
#
# 本 workflow 切到 omni twrp-4.4-deprecated → TWRP 2.8.7.x，其 sepolicy
# 版本 26-27 ≤ 28，内核可接受。用户明确：不追新版，2.8.7.x 也行，
# 核心需求是能用、功能正常、稳定。
#
# 已查证（GitHub API 实测 2026-10-12）：
#   * minimal-manifest-twrp/platform_manifest_twrp_omni 有 twrp-4.4-deprecated ✅
#   * omnirom/android_bootable_recovery 有 android-4.4 分支 ✅
#   * omnirom/android_external_sepolicy 有 android-4.4 分支（policy 26-27）✅
#
# 同设备树双产品链：lunch omni_D817_44-eng（本 workflow）
# 设备树改动：recovery.fstab 改 mmcblk0pX（实测分区表）+ 补 2.8.7 变量
#
# 4.4 vs 9.0 构建差异：
#   * JDK：4.4 时代用 JDK 7（官方要 6，7 兼容）；9.0 用 JDK 8
#   * python2.7：两者都需要（ubuntu-22.04 无，需源码编译）
#   * 产品链：4.4 只有 full_base.mk（core_minimal/embedded 是 9.0+ 产物）
#   * mkbootimg：4.4 是 python2 optparse（负数 --tags_offset=-0x378000 直传 OK）
#
# 构建主机：GitHub-hosted public runner（4vCPU/16G/14G SSD/6h 上限，public 免无限分钟）
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_twrp_44.yml'
      - 'device_tree/**'
  workflow_dispatch:

permissions:
  contents: write      # release upload
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350   # 低于 public-repo 6h job 上限

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup The Actions Workspace
        uses: rokibhasansagar/slimhub_actions@main

      - name: Environment Recon (resource + reachability probe)
        run: |
          echo "== nproc =="; nproc
          echo "== mem =="; free -h
          echo "== disk =="; df -h / /tmp /mnt | head -6
          echo "== resident toolchain =="; (gcc --version | head -1); (python3 --version)
          echo "== outbound probes =="
          for u in https://android.googlesource.com https://github.com https://gitlab.com; do
            code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$u" || echo FAIL)
            echo "$u -> $code"
          done

      # Android 4.4 官方要求 JDK 6；JDK 7 向后兼容且 ubuntu-22.04 上更易获得。
      # 若 7 触发 UnsupportedClassVersionError 再降级尝试 6。
      - name: Install OpenJDK 7 (required by omni-4.4/AOSP-4.4 build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '7'
          default: true

      - name: Host build dependencies
        run: |
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq --no-install-recommends \
            git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
            unzip bc python3 python-is-python3 ccache lzop rsync schedtool \
            gcc-10 g++-10 libssl-dev libbz2-dev libffi-dev libreadline-dev libsqlite3-dev liblzma-dev
          for p in gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev lib32ncurses-dev \
                   lib32z1-dev x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc; do
            sudo apt-get install -y -qq --no-install-recommends "$p" \
              || echo "[optional] skipped: $p"
          done
          echo "ccache: $(ccache --version | head -1)"

      - name: Recover python2.7 (omni-4.4 is a python2 build system)
        run: |
          # ubuntu-22.04 移除了 python2.7；从官方源码编译 2.7.18（SHA256 固定）
          cd /tmp
          curl -fsSL -o Python-2.7.18.tgz https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          echo "da3080e3b488f648a3d7a4560ddee895284c3380b11d6de75edb986526b9a814  Python-2.7.18.tgz" | sha256sum -c -
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          # gcc-10 默认 -fno-common；CPython 2.7 依赖历史 -fcommon 链接模型
          CC=gcc-10 CFLAGS="-fcommon" ./configure --prefix=/opt/py27 --enable-shared --without-ensurepip
          make -j$(nproc)
          sudo make install
          # 注册动态加载器搜索路径（--enable-shared 装到 /opt/py27/lib，默认不在搜索路径）
          echo "/opt/py27/lib" | sudo tee /etc/ld.so.conf.d/py27.conf
          sudo ldconfig
          echo "LD_LIBRARY_PATH=/opt/py27/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          sudo ln -sf /opt/py27/bin/python2.7 /usr/local/bin/python2
          sudo ln -sf /opt/py27/bin/python2.7 /usr/local/bin/python   # AOSP 脚本调用 `python`
          echo "PATH=/opt/py27/bin:$PATH" >> "$GITHUB_ENV"
          /opt/py27/bin/python2.7 --version

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize omni twrp-4.4 TWRP source
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "cnb-actions"
          git config --global user.email "actions@localhost"
          # ★ 根因修复：twrp-9.0(sepolicy v30) → twrp-4.4-deprecated(sepolicy v26-27)
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-4.4-deprecated
          # ★ run#3 真因：该精简 manifest 把 external/mksh 注释掉了，而
          # build/core/config.mk 默认 TARGET_SHELL := mksh → 'No rule to make target mksh'。
          # 用 local_manifest 补回（revision 锚定 default android-4.4.4_r1，走 aosp remote）。
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/mksh.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="external/mksh" name="platform/external/mksh" groups="pdk" />
          </manifest>
          XML
          echo "--- local_manifest mksh.xml ---"
          cat .repo/local_manifests/mksh.xml
          echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"
        id: pwd

      - name: Repo Sync (trimmed minimal manifest)
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          for attempt in 1 2 3 4 5; do
            echo "== repo sync attempt $attempt =="
            if repo sync -c --force-sync -j$(nproc --all); then break; fi
            echo "== retry after 15s =="; sleep 15
          done
          df -h . | tail -2

      - name: Place D817 device tree
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          mkdir -p device/urbetter
          cp -a "$GITHUB_WORKSPACE/device_tree/urbetter/D817" device/urbetter/
          ls -la device/urbetter/D817

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Building recovery (TWRP 2.8.7.x / omni-4.4)
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          # ★ OpenJDK 7 的 `java -version` 首行以 "openjdk version ..." 开头，
          # 而 omni-4.4 build/core/main.mk:155 的锚点是 `^java .*` -> 匹配失败
          # 触发 `$(error stop)`（run#2 失败真因）。仅放宽该锚点，其余版本检查保留。
          grep -n "grep '\^java " build/core/main.mk || true
          sed -i "s#grep '\^java #grep -E '^(java|openjdk) #g" build/core/main.mk
          echo "--- patched line ---"
          grep -n "openjdk) \.\*" build/core/main.mk || echo "!! sed 未命中"
          # ★ run#4 根因：宿主 gcc(>=10) 默认 -fno-common，而 AOSP-4.4
          # external/checkpolicy/checkpolicy.h:16 在头文件内直接定义全局变量
          # te_assertions → checkpolicy.o / policy_parse.o / policy_define.o
          # 链接时 multiple definition（run#4 日志行 7115-7127）。
          # 修法：只给 HOST_GLOBAL_CFLAGS 追加 -fcommon（已核实 omnirom android_build
          # android-4.4 的 core/combo/HOST_linux-x86.mk 全部用 += 追加，追加安全）；
          # 只影响宿主侧工具编译，设备侧走 prebuilts gcc 4.x 不受影响。
          echo "== checkpolicy.h:16 evidence =="
          sed -n '10,20p' external/checkpolicy/checkpolicy.h || true
          echo "== ASTWriter.cpp static data() helpers (run#6 根因证据) =="
          sed -n '57,69p' external/clang/lib/Serialization/ASTWriter.cpp || true
          printf '\n# run#5 fix: restore -fcommon for host tools (host gcc>=10 defaults to -fno-common)\nHOST_GLOBAL_CFLAGS += -fcommon\n# run#6 fix: 宿主 gcc-11 默认 gnu++17，使 std::data 经 ADL 进入候选集并抢走\n# ASTWriter.cpp 顶部 static StringRef data() 的唯一匹配（llvm 3 参数 StringRef 版）\n# -> ASTWriter.cpp:1387 multiple definition 风格 no matching function 错误。\n# 压回 gnu++11：libstdc++ 的 std::data 有 __cplusplus>=201402L guard，gnu++11 下\n# 不可见，static data() 恢复唯一候选。设备侧 prebuilts gcc 4.x 不受影响。\nHOST_GLOBAL_CFLAGS += -std=gnu++11\n' >> build/core/combo/HOST_linux-x86.mk
          echo "--- HOST_linux-x86.mk tail ---"
          tail -4 build/core/combo/HOST_linux-x86.mk
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          # ★ 4.4 专用产品链（omni_D817_44.mk 只继承 4.4 存在的 full_base.mk）
          lunch omni_D817_44-eng && mka adbd recoveryimage -j$(nproc --all)

      # ★★ 2026-10-13 u-boot 接受层修复（§9.35/§9.36，设备二进制实证）★★
      # RK u-boot（rkproduct；rk32plat.h RK3288 -> CONFIG_SECUREBOOT_CRYPTO ->
      # config.h SECUREBOOT_CRYPTO_EN）在 ANDROID! 加载路径调用
      # SecureNSModeBootImageShaCheck：
      #   id[0:20] == SHA1(kernel||kernel_size||ramdisk||ramdisk_size||second_size
      #                    ||tags_addr||page_size||unused||name||cmdline)
      # 不符 -> SecureBootImageCheck=false -> NS 模式 -> board_fbt_boot_failed("ramdisk")
      #        -> do_rockusb -> 本机无 USB 数据口 -> 永悬 = 卡 LOGO（内核从未执行）。
      # 实证：设备 idblock（RC4 解密）含 "boot/recovery image sha mismatch!"；
      #       run#11 header id=1731e9bc… != 公式值 7e310dda…（即其卡 LOGO 首因）。
      # AOSP/TeamWin mkbootimg 写的 id 不是该公式 -> 本步骤构建后按公式重算。
      - name: Fix RK boot header id (u-boot SecureBootImageCheck gate)
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          OUT=out/target/product/D817
          python3 - "$OUT/recovery.img" <<'PY'
          import struct, sys, hashlib, os
          REC = sys.argv[1]
          # 原厂 recovery id[0:20]（每日开机 + 对照组实证；本地与设备备份逐字节复算命中）
          STOCK_ID = bytes.fromhex('7e2d10e8cad2042b1ec7ed3c7af100bcb63970a5')
          d = bytearray(open(REC, 'rb').read())
          assert d[:8] == b'ANDROID!', 'ANDROID! magic missing'
          def u32(o): return struct.unpack_from('<I', d, o)[0]
          ks, rs, ss, tags, page = u32(8), u32(16), u32(24), u32(32), u32(36)
          roff = page + ((ks + page - 1)//page)*page
          def rk_sha1(img, base=0):
              b = (bytes(img[base+page:base+page+ks]) + struct.pack('<I', ks) +
                   bytes(img[base+roff:base+roff+rs]) + struct.pack('<I', rs) +
                   struct.pack('<I', ss) + struct.pack('<I', tags) +
                   struct.pack('<I', page) + bytes(img[base+40:base+48]) +
                   bytes(img[base+48:base+64]) + bytes(img[base+64:base+576]))
              return hashlib.sha1(b).digest()
          old = bytes(d[576:596]); calc = rk_sha1(d)
          print('stored id[0:20] =', old.hex())
          print('RK formula id   =', calc.hex())
          assert calc != old, '!! mkbootimg 竟已写出 RK 公式 id（异常，需人工复核）'
          # 负向锚：篡改 ramdisk 1 字节 -> 公式 id 必须变化（证明门禁有牙）
          bad = bytearray(d); bad[roff] ^= 0xFF
          assert rk_sha1(bad) != bytes(bad[576:596]), '负向锚失效：篡改未被公式感知'
          print('负向锚 OK: ramdisk 篡改 1 字节 -> 公式 id 变化（门禁可检测）')
          # 正向锚：仓内原厂 recovery.img（老 gap 视图，magic@0x400000）按同公式
          # 必须得到 STOCK_ID（公式理解正确性的一环境内证明）
          stock = os.path.join(os.environ.get('GITHUB_WORKSPACE', ''), 'recovery.img')
          if os.path.exists(stock):
              s = open(stock, 'rb').read()
              soff = s.find(b'ANDROID!')
              assert soff >= 0, 'stock ANDROID! missing'
              sks = struct.unpack_from('<I', s, soff+8)[0]
              srs = struct.unpack_from('<I', s, soff+16)[0]
              sss = struct.unpack_from('<I', s, soff+24)[0]
              stags = struct.unpack_from('<I', s, soff+32)[0]
              spage = struct.unpack_from('<I', s, soff+36)[0]
              sroff = soff + spage + ((sks + spage - 1)//spage)*spage
              sbuf = (s[soff+spage:soff+spage+sks] + struct.pack('<I', sks) +
                      s[sroff:sroff+srs] + struct.pack('<I', srs) + struct.pack('<I', sss) +
                      struct.pack('<I', stags) + struct.pack('<I', spage) +
                      s[soff+40:soff+48] + s[soff+48:soff+64] + s[soff+64:soff+576])
              sid = hashlib.sha1(sbuf).digest()
              print('stock formula id =', sid.hex(), '(expect', STOCK_ID.hex() + ')')
              assert sid == STOCK_ID, '正向锚失效：原厂镜像公式不符——公式理解错误!'
              print('正向锚 OK: 原厂 recovery.img 公式 id == 设备实测 id')
          else:
              print('正向锚 SKIP: 仓内无 recovery.img（仅断言常量，判别力减弱）')
          # 修复：写入公式 id；id[20:32] 清零（与原厂一致，RK 校验只比前 20 字节）
          d[576:596] = calc
          d[596:608] = b'\x00' * 12
          open(REC, 'wb').write(bytes(d))
          assert rk_sha1(d) == bytes(d[576:596]), '修复后自校验失败'
          print('FIXED id[0:20] =', bytes(d[576:596]).hex(), '| id[20:32] zeroed')
          print('sha256(fixed) =', hashlib.sha256(bytes(d)).hexdigest())
          PY

      # 结构自检 + ★★ 新增 SELinux/fstab 根因关卡（FIXPLAN_v1.md SIM-5/6/7 + CAL-3）
      - name: Verify built recovery image (structural + rootcause self-check)
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          OUT=out/target/product/D817
          ls -la "$OUT" | head -20
          REC="$OUT/recovery.img"
          echo "== sha256 =="; sha256sum "$REC"
          echo "== size =="; stat -c%s "$REC"
          python3 - "$REC" <<'PY'
          import struct, sys, gzip, io
          d = open(sys.argv[1], 'rb').read()
          i = d.find(b'ANDROID!')
          print('ANDROID! @', hex(i))
          def u32(o): return struct.unpack_from('<I', d, i+o)[0]
          print('kernel_size =', u32(8), 'kernel_addr =', hex(u32(12)))
          print('ramdisk_size =', u32(16), 'ramdisk_addr =', hex(u32(20)))
          print('tags_addr =', hex(u32(32)), 'page_size =', u32(36), 'dt_size =', u32(40))
          # ---- SIM-1: header 契约（设备实测 p6 字节契约，ANDROID!@0x0 无前缀）----
          assert i == 0x0, 'ANDROID! must be at partition offset 0x0 (no 4MB prepend)!'
          assert u32(36) == 16384, 'page size drifted'
          assert u32(12) == 0x60408000 and u32(20) == 0x62000000, 'addr contract drifted'
          assert u32(32) == 0x60088000, 'tags_addr contract drifted'
          print('SIM-1 OK: header matches device-verified p6 byte contract')

          # ---- SIM-5（根因关卡）：ramdisk 内 sepolicy 版本必须 <= 28 ----
          page = u32(36)
          ksz = u32(8); rsz = u32(16)
          roff = page + ((ksz + page - 1)//page)*page
          rd = d[roff:roff+rsz]
          assert rd[:2] == b'\x1f\x8b', 'ramdisk not gzip'
          raw = gzip.decompress(rd)
          print('ramdisk cpio decompressed:', len(raw), 'bytes')
          def cpio_files(raw):
              pos = 0
              while pos+110 <= len(raw):
                  if raw[pos:pos+6] != b'070701':
                      nxt = raw.find(b'070701', pos+1)
                      if nxt < 0: break
                      pos = nxt; continue
                  h = raw[pos:pos+110]
                  try:
                      ns = int(h[94:102],16); fs = int(h[54:62],16)
                  except ValueError:
                      pos += 1; continue
                  nm = raw[pos+110:pos+110+ns-1].decode('utf-8','replace')
                  doff = (pos+110+ns+3)&~3
                  yield nm, raw[doff:doff+fs]
                  pos = doff + ((fs+3)&~3)
          files = dict(cpio_files(raw))
          print('ramdisk entries:', len(files))
          sp = files.get('sepolicy')
          if sp is None:
              print('SIM-5 WARN: sepolicy not in ramdisk（TWRP 可能内联编译，跳过）')
          else:
              # policydb 头：u32 magic(0xf97cff8c) + u32 magic_len + str + u32 version
              magic = struct.unpack('<I', sp[0:4])[0]
              assert magic == 0xf97cff8c, 'sepolicy magic wrong: %08x' % magic
              mlen = struct.unpack('<I', sp[4:8])[0]
              ver = struct.unpack('<I', sp[8+mlen:12+mlen])[0]
              print('sepolicy version =', ver, '(内核上限 28)')
              assert ver <= 28, '*** SIM-5 FAIL: sepolicy v%d > 内核上限 28（卡 LOGO 根因）***' % ver
              print('SIM-5 OK: sepolicy v%d <= 28' % ver)

          # ---- SIM-6（根因关卡）：fstab 挂载设备必须是本机真实存在的块设备 ----
          # ★ 口径修正（2026-10-13，run#10「假红」根因）：旧版用 `'rknand' not in txt`
          #   对【整个文件】做朴素子串匹配，把 recovery.fstab 注释头里的修复说明
          #   （字面提及原厂 Nand 节点名）误判为违规 → run#10 明明构建成功、产物
          #   正确（SIM-1/SIM-5 全过、fstab 全部 mmcblk0pX）却被本门禁拦截。
          #   正确口径：只解析真实挂载行（跳过 # 注释与空行），校验其【设备字段】
          #   是否属于本机实测存在的块设备。禁止再回到全文字符串匹配。
          fst = files.get('etc/recovery.fstab') or files.get('recovery.fstab')
          if fst is None:
              print('SIM-6 WARN: recovery.fstab not in ramdisk')
          else:
              txt = fst.decode('utf-8','replace')
              print('--- etc/recovery.fstab verbatim ---')
              print(txt.rstrip())
              print('--- end recovery.fstab ---')
              entries = []
              for line in txt.splitlines():
                  s = line.strip()
                  if not s or s.startswith('#'):
                      continue
                  parts = s.split()
                  if len(parts) >= 3:
                      entries.append(parts)
              assert entries, '*** SIM-6 FAIL: fstab 无任何有效挂载行 ***'
              # 本机实测 /dev/block/ 仅含：mmcblk0、mmcblk0p1..p14、mmcblk1(+p1,p2)、sda1
              ALLOWED = set(['/dev/block/mmcblk0'] +
                            ['/dev/block/mmcblk0p%d' % i for i in range(1, 15)] +
                            ['/dev/block/mmcblk1', '/dev/block/mmcblk1p1',
                             '/dev/block/mmcblk1p2', '/dev/block/sda1'])
              bad = [p for p in entries if p[2] not in ALLOWED]
              assert not bad, '*** SIM-6 FAIL: fstab 含本机不存在的块设备: %s ***' % bad
              print('SIM-6 OK: %d 个挂载行全部使用本机真实设备（mmcblk0pX / mmcblk1 / sda1）'
                    % len(entries))
              for p in entries:
                  print('   %-16s %-6s %s' % (p[0], p[1], p[2]))

          # ---- SIM-7：init.rc 引用链 ----
          rc = files.get('init.rc')
          if rc:
              txt = rc.decode('utf-8','replace')
              miss = []
              for line in txt.splitlines():
                  s = line.strip()
                  if s.startswith('import '):
                      fn = s.split()[1].lstrip('/')
                      fn = fn.replace('${ro.hardware}', 'rk30board')
                      if fn not in files:
                          miss.append(fn)
              if miss:
                  print('SIM-7 WARN: init.rc import 缺失:', miss)
              else:
                  print('SIM-7 OK: init.rc 引用链完整')
          print('STRUCTURE + ROOTCAUSE GATE OK')
          PY
          echo "== TWRP marker strings =="
          strings "$REC" | grep -ci 'twrp' || true

